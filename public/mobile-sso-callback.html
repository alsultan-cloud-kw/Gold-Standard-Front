<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Returning to Gold Standard</title>
    <script>
      (function () {
        var base = 'goldstandard://sso-callback'
        var q = window.location.search || ''
        var h = window.location.hash || ''
        var target = base
        if (q) {
          target = base + q
        } else if (
          h.indexOf('rotating_token_nonce') >= 0 ||
          h.indexOf('created_session_id') >= 0
        ) {
          target = base + '?' + h.replace(/^#/, '').replace(/^\?/, '')
        }
        window.location.replace(target)
      })()
    </script>
  </head>
  <body
    style="
      font-family: system-ui, sans-serif;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      margin: 0;
      background: #f7f9f5;
      color: #1a1a1a;
    "
  >
    <p>
      Returning to the Gold Standard app…
      <a id="open" href="goldstandard://sso-callback">Open app</a>
    </p>
    <script>
      document.getElementById('open').href =
        'goldstandard://sso-callback' + (window.location.search || '')
    </script>
  </body>
</html>
